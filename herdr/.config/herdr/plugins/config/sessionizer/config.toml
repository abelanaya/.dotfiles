[projects]
# Parent folders searched by the interactive pickers
roots = ["~/projects", "~/"]
# true: only git repos; false: all immediate child folders
git_only = true
# Only used when git_only = true; 1 means immediate children
depth = 1

[ui]
# How Sessionizer / Worktree pickers open in Herdr: overlay | split | popup
# popup requires Herdr >= 0.7.4 (width/height only apply to popup)
placement = "popup"

[layout]
# Which pane or tab to focus after layout creation
focus = "editor"

[tabs.dev]
label = "1 nvim"

[[tabs.dev.panes]]
id = "editor"
title = "nvim"
command = "nvim"

[tabs.agent]
label = "2 opencode"

[[tabs.agent.panes]]
id = "agent"
title = "opencode"
command = "opencode"

[tabs.git]
label = "3 lazygit"

[[tabs.git.panes]]
id = "lazygit"
title = "lazygit"
command = "lazygit"

[tabs.terminal]
label = "4 terminal"

[[tabs.terminal.panes]]
id = "terminal"
title = "terminal"

[tabs.server]
label = "5 server & logs"

[[tabs.server.panes]]
id = "server 1"
title = "server 1"

[[tabs.server.panes]]
id = "server 2"
from = "server 1"
split = "right"
title = "server 2"
